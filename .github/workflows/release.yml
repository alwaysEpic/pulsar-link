name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the job that creates the release may write.
permissions:
  contents: read

# One run per tag at a time, so a re-run never races the release it is repairing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit, and the job holding the signing secrets compiles nothing:
# dependency build scripts run in the unprivileged build jobs, which hand over only the
# binary. No build cache anywhere in this workflow: a restored cache could carry another
# run's code into a release. The release is a draft, published by hand once the downloaded
# .dmg has been checked.
jobs:
  linux:
    name: Build (linux-${{ matrix.arch }})
    if: github.repository == 'alwaysEpic/pulsar-link'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install BlueZ headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build release
        run: cargo build --release -p pulsar-link

      # Every dependency's licence and copyright notice ships with the binary.
      - name: Third-party notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          ./scripts/notices.sh

      - name: Package
        run: |
          mkdir -p pulsar-link
          cp target/release/pulsar-link README.md LICENSE THIRD-PARTY-NOTICES.txt pulsar-link/
          tar -czf "pulsar-link-linux-$ARCH.tar.gz" pulsar-link

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: pulsar-link-linux-${{ matrix.arch }}.tar.gz

  macos-build:
    name: Build (macos)
    if: github.repository == 'alwaysEpic/pulsar-link'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Build universal binary
        run: |
          cargo build --release -p pulsar-link --target aarch64-apple-darwin
          cargo build --release -p pulsar-link --target x86_64-apple-darwin
          lipo -create -output pulsar-link \
            target/aarch64-apple-darwin/release/pulsar-link \
            target/x86_64-apple-darwin/release/pulsar-link

      # Every dependency's licence and copyright notice ships with the binary.
      - name: Third-party notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          ./scripts/notices.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-binary
          path: |
            pulsar-link
            THIRD-PARTY-NOTICES.txt

  macos:
    name: Sign and notarize (macos)
    needs: macos-build
    runs-on: macos-latest
    timeout-minutes: 60
    # The signing secrets live in this environment, which admits only v* tags and waits
    # for the owner's approval.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-binary

      # Artifacts drop the executable bit.
      - name: Restore the binary's mode
        run: chmod +x pulsar-link

      # The secrets reach only the steps that need them, never the third-party actions.
      # A release is always signed and notarized: without the secrets, this fails.
      - name: Import the Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::error::MACOS_CERT_P12 is not set: a release must be signed" >&2
            exit 1
          fi
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          # The runner is thrown away after the job, so the signing keychain can be the
          # whole search list; the system keychains are searched regardless.
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::the certificate holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Bundle
        run: BINARY=pulsar-link ./scripts/bundle-macos.sh

      - name: Make the disk image
        run: |
          mkdir -p dmg
          cp -R "target/bundle/Pulsar Link.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Pulsar Link" -srcfolder dmg -ov -format UDZO pulsar-link-macos.dmg
          codesign --force --timestamp --sign "$IDENTITY" pulsar-link-macos.dmg

      # An App Store Connect API key (Developer role), not an Apple ID: it can be revoked
      # alone and does not depend on anyone's password or second factor.
      - name: Notarize
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "::error::the notary API key secrets are not set: a release must be notarized" >&2
            exit 1
          fi
          umask 077
          KEY="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$KEY"
          AUTH=(--key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          # notarytool can exit 0 on a rejected submission, so the status decides. Every
          # command below tolerates failure so the error and Apple's log always print.
          RESULT=$(xcrun notarytool submit pulsar-link-macos.dmg "${AUTH[@]}" \
            --wait --timeout 30m --output-format json) || true
          echo "$RESULT"
          STATUS=$(echo "$RESULT" | jq -r '.status // empty' 2>/dev/null) || true
          if [ "$STATUS" != "Accepted" ]; then
            ID=$(echo "$RESULT" | jq -r '.id // empty' 2>/dev/null) || true
            if [ -n "$ID" ]; then xcrun notarytool log "$ID" "${AUTH[@]}" || true; fi
            echo "::error::notarization ended as '${STATUS:-no result}'" >&2
            exit 1
          fi
          xcrun stapler staple pulsar-link-macos.dmg

      # Gone before any action's own cleanup step runs.
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary-key.p8"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: pulsar-link-macos.dmg

  release:
    name: Create Release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la pulsar-link-*

      # A re-run replaces the assets of the draft it made rather than making a second one.
      # A published release is never touched: --clobber would swap live downloads unreviewed,
      # and a failed upload would leave one deleted.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$DRAFT" != "true" ]; then
              echo "::error::$TAG is already published; its assets are not replaced" >&2
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber pulsar-link-*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$TAG" --generate-notes pulsar-link-*
          fi
